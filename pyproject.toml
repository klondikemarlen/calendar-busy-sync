[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "calendar-busy-sync"
version = "1.1.0"
description = "Local anonymous busy-time mirroring between Google Calendar and Outlook"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "google-auth-oauthlib>=1.0", "msal>=1.24"]

[project.optional-dependencies]
dev = ["ruff>=0.11,<1", "build>=1.2,<2"]

[project.scripts]
calendar-busy-sync = "calendar_busy_sync.cli:main"

[project.urls]
Repository = "https://github.com/klondikemarlen/calendar-busy-sync"
Issues = "https://github.com/klondikemarlen/calendar-busy-sync/issues"

[tool.setuptools]
packages = ["calendar_busy_sync"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
